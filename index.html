<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Option Trader Dashboard</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="container">


    <!-- HEADER -->

    <header>

        <div>

            <h1>
                📊 Option Trader
            </h1>

            <p>
                Market Data Dashboard
            </p>

        </div>


        <div class="status">

            <span
                class="status-dot"
            ></span>

            <span id="systemStatus">
                System Ready
            </span>

        </div>

    </header>


    <!-- MARKET DATA -->

    <section>

        <div class="section-header">

            <h2>
                Market Data
            </h2>

            <span
                class="last-update"
                id="lastChecked"
            >
                Last checked: —
            </span>

        </div>


        <div class="cards">


            <div class="card">

                <div class="card-title">
                    Nifty 50
                </div>

                <div
                    class="date"
                    id="nifty50Date"
                >
                    —
                </div>

                <div class="label">
                    Latest data
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Bank Nifty
                </div>

                <div
                    class="date"
                    id="bankNiftyDate"
                >
                    —
                </div>

                <div class="label">
                    Latest data
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Nifty Midcap 50
                </div>

                <div
                    class="date"
                    id="midcapDate"
                >
                    —
                </div>

                <div class="label">
                    Latest data
                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    India VIX
                </div>

                <div
                    class="date"
                    id="vixDate"
                >
                    —
                </div>

                <div class="label">
                    Latest data
                </div>

            </div>


        </div>

    </section>


    <!-- ACTIONS -->

    <section>

        <h2>
            Actions
        </h2>


        <div class="actions">

            <button
                id="updateDataBtn"
                class="primary-btn"
            >
                🔄 Update Historical Data
            </button>


            <button
                id="testConnectionBtn"
                class="secondary-btn"
            >
                🔌 Test Angel One Connection
            </button>

            <button
                id="calculateMetricsBtn"
                class="secondary-btn"
            >
                📊 Calculate Derived Metrics
            </button>

        </div>

    </section>


    <!-- CONSOLE -->

    <section>

        <div class="section-header">

            <h2>
                Console Output
            </h2>


            <span
                class="console-status"
                id="consoleStatus"
            >
                Waiting
            </span>

        </div>


        <div class="console-card">

            <pre id="consoleOutput">Option Trader Console

Ready.
Select an action to begin.</pre>

        </div>

    </section>


</div>


<script src="app.js"></script>

</body>

</html>
