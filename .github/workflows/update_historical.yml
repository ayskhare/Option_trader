name: Update Historical Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update historical data
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_KEY: ${{ secrets.ANGEL_TOTP_KEY }}
        run: |
          python download_historical.py

      - name: Commit updated data
        run: |
          git config user.name "Option Trader Bot"
          git config user.email "option-trader-bot@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update historical market data"
            git push
          fi
