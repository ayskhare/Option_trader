<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Option Trader Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header>
        <div>
            <h1>📊 Option Trader</h1>
            <p>Market Data Dashboard</p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            System Ready
        </div>
    </header>


    <!-- Data Overview -->
    <section>

        <div class="section-header">
            <h2>Market Data</h2>
            <span class="last-update">
                Last checked: —
            </span>
        </div>


        <div class="cards">

            <div class="card">
                <div class="card-title">Nifty 50</div>
                <div class="date">—</div>
                <div class="label">Latest data</div>
            </div>

            <div class="card">
                <div class="card-title">Bank Nifty</div>
                <div class="date">—</div>
                <div class="label">Latest data</div>
            </div>

            <div class="card">
                <div class="card-title">Nifty Midcap 50</div>
                <div class="date">—</div>
                <div class="label">Latest data</div>
            </div>

            <div class="card">
                <div class="card-title">India VIX</div>
                <div class="date">—</div>
                <div class="label">Latest data</div>
            </div>

        </div>

    </section>


    <!-- Actions -->
    <section>

        <h2>Actions</h2>

        <div class="actions">

            <button id="updateDataBtn" class="primary-btn">
                🔄 Update Historical Data
            </button>

            <button id="testConnectionBtn" class="secondary-btn">
                🔌 Test Angel One Connection
            </button>

        </div>

    </section>


    <!-- Activity -->
    <section>

        <h2>Activity</h2>

        <div class="activity-card">

            <div class="activity-icon">ℹ️</div>

            <div>
                <strong>Dashboard ready</strong>

                <p id="activityMessage">
                    Waiting for an action...
                </p>
            </div>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
